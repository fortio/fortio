version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      exclude:
        - "fortio.org/*" # our own releases: pick up immediately
        - "grol.io/*"
    groups:
      "fortio and grol":
        patterns:
          - "fortio.org/*"
          - "grol.io/*"
      "go x":
        patterns:
          - "golang.org/x/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
